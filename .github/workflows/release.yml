name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;29.0.13846066"

      - name: Export Android environment
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/29.0.13846066" >> "$GITHUB_ENV"
          echo "NDK_HOME=$SDK_ROOT/ndk/29.0.13846066" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install dx
        run: |
          curl -sSL https://dioxus.dev/install.sh | sh -s -- v0.7.10
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not configured" >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.jks

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import json
          import os

          with open("Dioxus.toml", "a", encoding="utf-8") as config:
              config.write("\n[bundle.android]\n")
              config.write('jks_file = "release.jks"\n')
              config.write(f"jks_password = {json.dumps(os.environ['ANDROID_KEYSTORE_PASSWORD'])}\n")
              config.write(f"key_alias = {json.dumps(os.environ['ANDROID_KEY_ALIAS'])}\n")
              config.write(f"key_password = {json.dumps(os.environ['ANDROID_KEY_PASSWORD'])}\n")
          PY

      - name: Build release APK
        run: dx build --android --release --target aarch64-linux-android

      - name: Verify release APK
        run: |
          APK=$(find target/dx -path "*/release/*" -name "app-release.apk" | head -n 1)
          test -n "$APK"
          "${ANDROID_HOME}/build-tools/34.0.0/apksigner" verify --print-certs "$APK"
          ASSET="lazygo-${GITHUB_REF_NAME//\//-}.apk"
          cp "$APK" "$ASSET"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: LazyGo ${{ github.ref_name }}
          generate_release_notes: true
          files: lazygo-*.apk

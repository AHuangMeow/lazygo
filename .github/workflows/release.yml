name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/29.0.13846066" >> "$GITHUB_ENV"
          echo "NDK_HOME=$SDK_ROOT/ndk/29.0.13846066" >> "$GITHUB_ENV"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" "platforms;android-34" "build-tools;34.0.0" "ndk;29.0.13846066"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install dx
        run: |
          curl -sSL https://dioxus.dev/install.sh | bash -s -- v0.7.10
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not configured" >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.jks

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import json
          import os

          with open("Dioxus.toml", "a", encoding="utf-8") as config:
              config.write("\n[bundle.android]\n")
              config.write('jks_file = "release.jks"\n')
              config.write(f"jks_password = {json.dumps(os.environ['ANDROID_KEYSTORE_PASSWORD'])}\n")
              config.write(f"key_alias = {json.dumps(os.environ['ANDROID_KEY_ALIAS'])}\n")
              config.write(f"key_password = {json.dumps(os.environ['ANDROID_KEY_PASSWORD'])}\n")
          PY

      - name: Build KataGo CPU engine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build
          chmod +x scripts/build-katago-android.sh
          KATAGO_ABIS=arm64-v8a ./scripts/build-katago-android.sh

      - name: Build release APK
        run: |
          cargo clean -p lazygo
          dx build --android --release --target aarch64-linux-android
          JNI_LIBS="target/dx/lazygo/release/android/app/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$JNI_LIBS"
          cp target/katago-dist/arm64-v8a/libkatago.so "$JNI_LIBS/libkatago.so"
          chmod 755 "$JNI_LIBS/libkatago.so"
          find "$JNI_LIBS" -maxdepth 1 -type f -ls
          cd target/dx/lazygo/release/android/app
          ./gradlew :app:assembleRelease
          cd -

      - name: Verify release APK
        run: |
          find target/dx -type f -name "*.apk" -print
          APK=$(find target/dx -type f -name "app-release.apk" | head -n 1)
          test -n "$APK"
          echo "APK=$APK"
          unzip -l "$APK" | grep -E "lib/" || true
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libkatago.so" || {
            echo "KataGo engine is missing from the APK" >&2
            exit 1
          }
          "${ANDROID_HOME}/build-tools/34.0.0/aapt2" dump badging "$APK" | grep "sdkVersion"
          "${ANDROID_HOME}/build-tools/34.0.0/aapt2" dump badging "$APK" | grep -q "sdkVersion:'29'"
          "${ANDROID_HOME}/build-tools/34.0.0/apksigner" verify --print-certs "$APK"
          ASSET="lazygo-${GITHUB_REF_NAME//\//-}.apk"
          cp "$APK" "$ASSET"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: LazyGo ${{ github.ref_name }}
          generate_release_notes: true
          files: lazygo-*.apk

[package]
name = "lazygo"
version = "0.2.1"
authors = ["AHuangMeow <ahuangmeow@gmail.com>"]
edition = "2021"
license = "MIT"

[dependencies]
dioxus = { version = "0.7.1" }
futures-timer = "3"
katago-analysis = "0.1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "sync"] }

[features]
default = ["mobile"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
